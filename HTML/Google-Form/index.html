<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Form</title>
    <link rel="shortcut icon" href="./Google Logo.png" type="image/x-icon">
</head>
<body>
    <form>
        <label for="first-text">Enter Your First Name : </label>
        <input id="first-text" required type="text" placeholder="Enter your First name"> <br> <br>
        <label for="last-text">Enter Your Last Name : </label>
        <input id="last-text" required type="text" placeholder="Enter your Last name"> <br> <br>
        <label for="email">Enter Your Email : </label>
        <input id="email" required type="email" placeholder="Enter your Email"> <br> <br>
        <label for="password">Enter Your Password : </label>
        <input id="password" required type="password" placeholder="Enter your Password"> <br> <br>
        <label for="date">Select your Age : </label>
        <input itemid="date" required type="date" name="" id=""> <br> <br>
        <label for="gender">Select your Gender : </label>
        <input id="Male" required type="radio" name="gender" id=""> 
        <label for="Male">Male</label>
        <input id="Female" required type="radio" name="gender" id=""> 
        <label for="Female">Female</label>
        <input id="other" required type="radio" name="gender" id=""> 
        <label for="other">Other</label> <br> <br>
        <label for="check-box">Are you ready to Submit : </label>
         <input id="check-box" required type="checkbox" name="" id=""> <br> <br>
        <button>Submit</button>
    </form>
</body>
</html>
